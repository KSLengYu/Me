<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>留言板</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        padding: 20px;
    }
    #messages {
        margin-top: 20px;
        padding: 10px;
    }
    .msg {
        background: white;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    textarea {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        resize: none;
        height: 80px;
    }
    button {
        margin-top: 10px;
        padding: 10px 18px;
        border: none;
        background: #4a90e2;
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }
</style>
</head>
<body>

<h2>留言板</h2>

<textarea id="content" placeholder="写点什么..."></textarea>
<button onclick="postMessage()">发布留言</button>

<div id="messages"></div>

<script src="app.js"></script>
</body>
</html>
