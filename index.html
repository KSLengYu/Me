<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板首页</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
    .user-info { margin-bottom: 20px; }
    .user-info img { width: 32px; height: 32px; border-radius: 50%; vertical-align: middle; margin-right: 8px; }
    #messages { margin-top: 20px; }
    .message { padding: 8px; border-bottom: 1px solid #ccc; }
    #new-message { margin-top: 10px; }
    button { padding: 5px 10px; }
  </style>
</head>
<body>
  <h2>留言板</h2>
  <div class="user-info" id="user-info">
    未登录，<a href="login.html">点击登录</a>
  </div>

  <div id="messages"></div>

  <div id="new-message">
    <textarea id="msg-text" placeholder="写点什么..." rows="3" cols="50"></textarea><br>
    <button id="send-btn">发布留言</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
