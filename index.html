<!DOCTYPE html>
<html lang="zh">
<head>

<title>留言板</title>
<style>
body {
  background: #111;
  color: #fff;
  font-family: Arial;
  padding: 20px;
}
textarea {
  width: 100%;
  height: 100px;
  border-radius: 6px;
  padding: 10px;
}
button {
  padding: 10px 20px;
  background: #0084ff;
  border: none;
  color: #fff;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>
<h1>留言板</h1>

<textarea id="msg" placeholder="输入留言..."></textarea>
<button onclick="postMessage()">发布</button>

<script>
function postMessage() {
  alert("留言功能你说我再加 Supabase 版本");
}
</script>

</body>
</html>
