<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QQ 登录</title>
</head>
<body>
  <h2>QQ 登录测试</h2>
  <button id="qq-login-btn">使用 QQ 登录</button>

  <script>
    const APPID = '你的水滴 AppID';
    const APPKEY = '你的水滴 AppKey';
    const REDIRECT = encodeURIComponent('https://你的域名/callback.html');

    document.getElementById('qq-login-btn').addEventListener('click', () => {
      const url = `https://uniqueker.top/connect.php?act=login&appid=${APPID}&appkey=${APPKEY}&type=qq&redirect_uri=${REDIRECT}`;
      window.location.href = url;
    });
  </script>
</body>
</html>
