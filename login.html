<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>邮箱登录</title>
<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.box {
  width: 300px;
  padding: 20px;
  background: #222;
  border-radius: 10px;
}
input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
}
button {
  width: 100%;
  padding: 10px;
  background: #0084ff;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
button:disabled {
  background: #555;
  cursor: not-allowed;
}
</style>
</head>
<body>
<div class="box">
  <h2>邮箱登录</h2>
  <input id="email" placeholder="输入邮箱">
  <button id="send">获取验证码</button>

  <input id="code" placeholder="输入验证码" style="margin-top:20px;">
  <button id="login">登录</button>
</div>

<script>
let countdown = 0;

function startCountdown(btn) {
  countdown = 60;
  btn.disabled = true;
  const interval = setInterval(() => {
    btn.textContent = `重新发送(${countdown}s)`;
    countdown--;
    if (countdown < 0) {
      clearInterval(interval);
      btn.textContent = "获取验证码";
      btn.disabled = false;
    }
  }, 1000);
}

document.getElementById("send").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  if (!email) { alert("请输入邮箱"); return; }

  try {
    const res = await fetch(`/api/sendCode?email=${encodeURIComponent(email)}`);
    const data = await res.json();

    if (data.ok) {
      alert("验证码已发送，请查看邮箱");
      startCountdown(document.getElementById("send"));
    } else {
      alert("发送失败：" + data.error);
    }
  } catch (err) {
    alert("发送异常：" + err);
  }
};

document.getElementById("login").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const code = document.getElementById("code").value.trim();
  if (!email || !code) { alert("请输入完整信息"); return; }

  try {
    const res = await fetch(`/api/verifyCode?email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`);
    const data = await res.json();

    if (data.ok) {
      alert("登录成功！");
      window.location.href = "/index.html";
    } else {
      alert("验证码错误");
    }
  } catch (err) {
    alert("验证异常：" + err);
  }
};
</script>
</body>
</html>
